name: Phase 0 Security Gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Phase 0 static gate
        run: node scripts/phase0-static-gate.mjs
      - name: Run Phase 0 contract tests
        run: node --test tests/phase0-contract.test.mjs
